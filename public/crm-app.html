  <script>
    // Links da sidebar do PCP são relativos. Em rotas React como /crm/clients,
    // sem uma base eles viravam /crm/pd.html, /crm/dashboard.html etc. Além de
    // fixar links futuros, recupera URLs ruins já abertas antes desta correção.
    (function() {
      var legacy = location.pathname.match(/^\/(?:crm|pd)\/([^/]+\.html)$/);
      if (legacy) history.replaceState(null, '', '/' + legacy[1] + location.search + location.hash);
    })();

    // O adaptador Firebase é um chunk lazy com nome versionado pelo build original.
    // Como ele recebeu correções locais sem recompilar todo o React, force uma URL
    // nova para impedir que o Chrome reutilize a cópia antiga desse único arquivo.
    (function() {
      var originalAppendChild = Element.prototype.appendChild;
      Element.prototype.appendChild = function(node) {
        if (node && node.tagName === 'SCRIPT' && /\/static\/js\/9752\.[^/]+\.chunk\.js(?:\?|$)/.test(node.src || '')) {
          var url = new URL(node.src, location.href);
          url.searchParams.set('pcp-rev', 'master-integration-20261008-1');
          node.src = url.href;
        }
        return originalAppendChild.call(this, node);
      };
    })();
  </script>
