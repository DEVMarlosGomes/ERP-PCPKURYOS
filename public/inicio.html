<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início</title>
  <!-- Tela Início (MENU-03, 29/10/2026; porte da inicio.html do Gustavo,
       gcallegaro-kur/PCP-Kuryos). "Precisa de você": cartões com o que espera
       pela pessoa; "Suas áreas": atalhos do mesmo registro do menu
       (shared/navegacao.js). Só lê os nós que os cartões visíveis usam. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://erpkuryos-default-rtdb.firebaseio.com">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/navegacao.js?v=20261029-2"></script>
  <script src="shared/manipulacao.js"></script>
  <script src="shared/perdas-etapa.js"></script>
  <script src="shared/sequencia-setor.js"></script>
  <script src="shared/cargas-pa.js"></script>
  <script src="auth_check.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    /* Identidade Kuryos: o azul-marinho da marca e as três matizes do tema (--s1/--s2/--s3). */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);min-height:100vh}
    .pagina{max-width:1240px;margin:0 auto;padding:22px 24px 48px}

    .hero{position:relative;overflow:hidden;border-radius:26px;padding:30px 34px;color:#fff;
      background:linear-gradient(125deg,#06123f 0%,#0a1c69 52%,var(--s1,#2e4fc0) 135%);
      box-shadow:0 18px 40px -22px rgba(10,28,105,.7);display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
    .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .hero::before{width:420px;height:420px;right:-90px;top:-210px;border:56px solid rgba(255,255,255,.07)}
    .hero::after{width:240px;height:240px;right:150px;bottom:-150px;background:radial-gradient(circle,rgba(143,163,232,.28),transparent 68%)}
    .hero>*{position:relative;z-index:1}
    .hero-logo{height:34px;width:auto;display:block;filter:brightness(0) invert(1);opacity:.96;margin-bottom:22px}
    .hero-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);margin-bottom:10px}
    .hero-chip:empty{display:none}
    /* Os estilos globais de título (kuryos-ui-*.css) pintam h1 com a tinta do tema: no cartão escuro fica branco. */
    .hero h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:#fff !important}
    .hero-sub{font-size:14px;color:rgba(255,255,255,.78);margin-top:6px}
    .resumo{min-width:190px;text-align:right;padding:14px 18px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
    .resumo b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
    .resumo span{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:5px}
    .resumo.ok b{font-size:22px}

    h2{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.7px;margin:30px 2px 12px}
    h2::after{content:"";flex:1;height:1px;background:var(--line)}

    .pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
    .cartao{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;text-decoration:none;color:var(--ink);min-height:84px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease}
    .cartao:hover{transform:translateY(-2px);border-color:var(--s1)}
    .cartao:focus-visible,.area a:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
    .cartao .ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--s2) 18%,transparent);color:color-mix(in srgb,var(--s2) 70%,var(--ink))}
    .cartao.alerta .ico{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
    .ico svg{width:23px;height:23px}
    .cartao .n{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;min-width:34px;text-align:center}
    .cartao.alerta .n{color:var(--critical)}
    .cartao b{display:block;font-size:14px;line-height:1.25}
    .cartao small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.3}
    .vazio{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius-md);padding:18px;color:var(--ink-soft);font-size:14px}
    .vazio .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3);flex:none}
    .vazio .ico svg{width:20px;height:20px}

    .areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
    .area{--tom:var(--s1);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 14px 10px;box-shadow:var(--shadow)}
    .area[data-tom="s2"]{--tom:var(--s2)}.area[data-tom="s3"]{--tom:var(--s3)}.area[data-tom="neutro"]{--tom:var(--ink-soft)}
    .area .topo{display:flex;align-items:center;gap:11px;padding:0 4px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
    .area .ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--tom) 14%,transparent);color:var(--tom)}
    .area .ico svg{width:19px;height:19px}
    .area h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em;flex:1}
    .area .qtd{font-size:11px;font-weight:700;color:var(--ink-soft);background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:99px;padding:2px 8px}
    .area .sub{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;margin:10px 6px 2px}
    .area a{display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:8px 8px;font-size:13.5px;color:var(--ink);text-decoration:none;border-radius:9px;transition:background .12s ease}
    .area a::after{content:"›";color:var(--ink-soft);font-size:17px;line-height:1;opacity:0;transition:opacity .12s ease}
    .area a:hover{background:color-mix(in srgb,var(--tom) 10%,transparent)}
    .area a:hover::after{opacity:1}

    .rodape{margin-top:38px;text-align:center;color:var(--ink-soft);font-size:12px}
    .rodape img{height:20px;display:block;margin:0 auto 8px;opacity:.55}
    :root[data-theme="dark"] .rodape img{filter:brightness(0) invert(1)}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rodape img{filter:brightness(0) invert(1)}}

    @media (prefers-reduced-motion:no-preference){
      .hero,.cartao,.area{animation:sobe .45s ease both}
      .area:nth-child(2){animation-delay:.04s}.area:nth-child(3){animation-delay:.08s}.area:nth-child(4){animation-delay:.12s}
      @keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    }
    @media (max-width:700px){
      .pagina{padding:14px 16px 40px}
      .hero{padding:22px 20px;border-radius:22px}
      .hero h1{font-size:26px}
      .hero-logo{height:28px;margin-bottom:18px}
      .resumo{width:100%;text-align:left;display:flex;align-items:baseline;gap:10px}
      .resumo b{font-size:28px}
      .area a{min-height:44px;padding:12px 8px}
    }
  </style>
</head>
<body class="kuryos-theme has-sidebar">
<main class="pagina">
  <section class="hero" aria-labelledby="ola">
    <div>
      <img class="hero-logo" src="kuryos-logo.svg" alt="Kuryos — Indústria de Cosméticos">
      <span class="hero-chip" id="chipPapel"></span>
      <h1 id="ola">Início</h1>
      <div class="hero-sub" id="sub"></div>
    </div>
    <div class="resumo" id="resumo" role="status" style="display:none"></div>
  </section>

  <section id="secPend" style="display:none" aria-labelledby="tituloPend">
    <h2 id="tituloPend">Precisa de você</h2>
    <div class="pend" id="pend" aria-live="polite"></div>
  </section>
  <section aria-labelledby="tituloAreas">
    <h2 id="tituloAreas">Suas áreas</h2>
    <div class="areas" id="areas"></div>
  </section>

  <footer class="rodape">
    <img src="kuryos-logo.svg" alt="">
    Sistema de Produção · Kuryos Indústria de Cosméticos
  </footer>
</main>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyBvASzcbKyv3uW7NBzDFDyLsKls3An3UUs",
  authDomain: "erpkuryos.firebaseapp.com",
  databaseURL: kuryosDatabaseURL("https://erpkuryos-default-rtdb.firebaseio.com"),
  projectId: "erpkuryos",
  storageBucket: "erpkuryos.firebasestorage.app",
  messagingSenderId: "272752392739",
  appId: "1:272752392739:web:047a6c4aa60145d77f4f96"
};
firebase.initializeApp(firebaseConfig);
kuryosConnectEmulatorsIfLocal();
var db = firebase.database();

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

var dados = {}, carregadas = {}, falhas = {}, cartoes = [], ctx = null;

var PAPEIS = {admin: 'Administrador', pcp: 'PCP', rh: 'RH Central', gestor: 'Gestor de Linha', qualidade: 'Qualidade',
  rotulagem: 'Rotulagem', logistica: 'Logística', comercial: 'Comercial', pd: 'P&D', production: 'Produção'};
function icone(nome) { return typeof ktIcon === 'function' && nome ? ktIcon(nome) : ''; }
// Dia de hoje no fuso de quem olha (AAAA-MM-DD), para comparar com datas previstas.
function hojeLocal() { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }

function montarContexto() {
  var u = window.currentUser;
  return {
    podeAbrir: function(pg) { return podeAbrirPagina(u, pg); },
    temMod: function(m) { return usuarioTemModulo(u, m); },
    role: u.role,
    setores: setoresOperacao(u)
  };
}

function saudacao() {
  var u = window.currentUser, h = new Date().getHours();
  var periodo = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  $('ola').textContent = periodo + ', ' + String(u.nome || '').split(' ')[0];
  $('chipPapel').textContent = PAPEIS[u.role] || '';
  var dia = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'});
  $('sub').textContent = dia.charAt(0).toUpperCase() + dia.slice(1);
}

function desenharAreas() {
  var blocos = KuryosNav.blocos(ctx);
  $('areas').innerHTML = blocos.map(function(b) {
    var sub = null, v = b.visual || ['dashboard', 's1'];
    var links = b.itens.map(function(it) {
      var cab = '';
      if (it.s !== sub) { sub = it.s; if (it.s) cab = '<div class="sub">' + esc(it.s) + '</div>'; }
      return cab + '<a href="' + esc(urlLimpa(it.h)) + '">' + esc(it.r) + '</a>';
    }).join('');
    return '<div class="area" data-tom="' + esc(v[1]) + '"><div class="topo"><span class="ico" aria-hidden="true">' + icone(v[0]) + '</span><h3>' + esc(b.nome) +
      '</h3><span class="qtd" aria-label="' + b.itens.length + ' telas">' + b.itens.length + '</span></div>' + links + '</div>';
  }).join('') || '<div class="vazio">Seu usuário ainda não tem nenhuma área liberada. Peça a um administrador em Usuários.</div>';
}

function desenharResumo(lista, prontos) {
  var el = $('resumo');
  if (!cartoes.length || (!lista.length && !prontos)) { el.style.display = 'none'; return; }
  el.style.display = '';
  if (!lista.length) { el.className = 'resumo ok'; el.innerHTML = '<b>Tudo em dia</b><span>nada esperando por você</span>'; return; }
  var total = lista.reduce(function(t, p) { return t + p.n; }, 0);
  el.className = 'resumo';
  el.innerHTML = '<b>' + total + '</b><span>' + (total === 1 ? 'item espera por você' : 'itens esperam por você') + '</span>';
}

function desenharPendencias() {
  if (!cartoes.length) { $('secPend').style.display = 'none'; $('resumo').style.display = 'none'; return; }
  $('secPend').style.display = '';
  var prontos = cartoes.every(function(c) { return c.fontes.every(function(f) { return carregadas[f]; }); });
  var lista = KuryosNav.pendencias(cartoes, dados, {
    CargasPA: window.CargasPA, SequenciaSetor: window.SequenciaSetor, PerdasEtapa: window.PerdasEtapa,
    hoje: hojeLocal(), agora: Date.now()
  });
  desenharResumo(lista, prontos);
  var aviso = Object.keys(falhas).length
    ? '<div class="vazio" role="alert">Não foi possível ler ' + esc(Object.keys(falhas).join(', ')) + ' (' + esc(Object.values(falhas)[0]) + '). Os cartões dessas filas podem estar incompletos; recarregue a página ou fale com o ADM.</div>'
    : '';
  if (!lista.length) {
    $('pend').innerHTML = aviso + '<div class="vazio"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
      (prontos ? 'Nada esperando por você agora nas suas áreas.' : 'Carregando…') + '</div>';
    return;
  }
  $('pend').innerHTML = aviso + lista.map(function(p) {
    return '<a class="cartao ' + (p.tom === 'alerta' ? 'alerta' : '') + '" href="' + esc(urlLimpa(p.href)) + '"><span class="ico" aria-hidden="true">' + icone(p.i) + '</span>' +
      '<span class="n">' + p.n + '</span><span><b>' + esc(p.titulo) + '</b><small>' + esc(p.texto || '') + '</small></span></a>';
  }).join('');
}

function iniciar() {
  ctx = montarContexto();
  saudacao();
  desenharAreas();
  cartoes = KuryosNav.cartoesVisiveis(ctx);
  desenharPendencias();
  // Só lê os nós que os cartões desta pessoa precisam.
  KuryosNav.fontesNecessarias(cartoes).forEach(function(f) {
    dbOnValue(db.ref(f), function(s) { dados[f] = s.val() || {}; carregadas[f] = true; delete falhas[f]; desenharPendencias(); },
      {onError: function(err) {
        console.error('Início: falha ao ler ' + f, err);
        falhas[f] = (err && (err.code || err.message)) || 'erro de leitura';
        carregadas[f] = true; desenharPendencias();
      }});
  });
}
window.addEventListener('kuryos-auth-pronto', function() { if (!ctx) iniciar(); });
if (window.currentUser) iniciar();
</script>
</body>
</html>
